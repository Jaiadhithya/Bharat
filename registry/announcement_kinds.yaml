# Exchange announcement description patterns -> doc_type (implementation.md 3). Case-insensitive regex.
# Owner of the patterns: B2 (harvest/announcements.py). Skeleton values below.
- {pattern: "investor presentation|analyst presentation|earnings presentation", doc_type: deck}
- {pattern: "transcript", doc_type: transcript}
- {pattern: "credit rating", doc_type: rating}
- {pattern: "scheme of (amalgamation|arrangement)|merger|demerger", doc_type: scheme}
