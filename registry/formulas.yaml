# Formula registry (implementation.md 5.3). Evaluated by an AST walker; no eval.
- {id: nii, text: "interest earned minus interest expended", expr: "interest_earned - interest_expended", unit: inr_cr, v: 1}
- {id: ppop, text: "net interest income plus other income minus operating expenses", expr: "nii + other_income - opex", unit: inr_cr, v: 1}
- {id: yoy, text: "change versus the same quarter a year earlier", expr: "x / lag(x, 4) - 1", unit: fraction, v: 1}
- {id: qoq, text: "change versus the previous quarter", expr: "x / lag(x, 1) - 1", unit: fraction, v: 1}
- {id: cagr_2y, text: "two-year compound growth", expr: "(x / lag(x, 8)) ** 0.5 - 1", unit: fraction, v: 1}
- {id: ldr, text: "advances divided by deposits", expr: "advances / deposits", unit: fraction, v: 1}
- {id: credit_cost, text: "annualised provisions over average advances", expr: "4 * provisions / mean(advances, lag(advances, 1))", unit: fraction, v: 1}
- {id: pat_minus_ppop_growth, text: "PAT growth minus PPOP growth (provision-driven profit)", expr: "yoy(pat) - yoy(ppop)", unit: pp, v: 1}
- {id: gnpa_change_vs_writeoffs, text: "share of GNPA decline explained by write-offs", expr: "write_offs / -(gnpa_amt - lag(gnpa_amt, 1) - gross_slippages)", unit: fraction, v: 1}
- {id: stage23_growth_vs_ratio, text: "Stage 2+3 amount growth vs Stage 2+3 ratio change", expr: "yoy(stage23_amt) - yoy(stage2_pct + stage3_pct)", unit: pp, v: 1}
- {id: share, text: "component share of total", expr: "part / total", unit: fraction, v: 1}
- {id: robust_z, text: "(x - peer median) / (1.4826 * peer MAD)", expr: "builtin", unit: z, v: 1}
- {id: adjusted_for_component, text: "reported value minus a component the company itself disclosed separately", expr: "x - component", unit: same, v: 1}
- {id: specificity, text: "1 minus peer-median change over company change, clipped to 0..1 (review D6)", expr: "builtin", unit: fraction, v: 1}
